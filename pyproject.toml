[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-through-data"
version = "0.1.0"
description = "A data-driven trading strategy backtester with a web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Live MetaTrader 5 connectivity. Windows-only: the MetaTrader5 package provides
# wheels for Windows and requires a running MT5 terminal. Not installed by
# default so the toolkit and simulated broker work on Linux/macOS.
mt5 = [
    "MetaTrader5>=5.0.45",
]

[project.scripts]
ttd = "trading_through_data.cli:main"
ttd-agent = "trading_through_data.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
